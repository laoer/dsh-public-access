name: CI

on:
  push:
    branches: [main, 'release/**', 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm run typecheck
      - run: npm test

      # The committed .js files are what dsh loads, so a stale artifact is a
      # broken release: rebuild and require the tree to stay unchanged.
      - run: npm run build
      - run: git diff --exit-code -- src
