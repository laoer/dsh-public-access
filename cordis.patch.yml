# Replace the stock web-startup row so this bundle can explicitly opt in to
# all-interface binding. dsh 0.2.1 rejects wildcard addresses in both the stock
# startup CLI and the webserver config schema, and it no longer derives LAN
# trustedHosts itself. The replacement startup widens the boot-path webserver
# host schema before providing webStartup, and it supplies the full
# trustedHosts list (explicit --trusted-host values plus interface-derived LAN
# authorities) that the stock `connection` row reads.
#
# Do not combine this bundle with another plugin that replaces `web-startup`.
- id: web-startup
  disabled: true

# The second row is the package root: the host half supplies the auth routes,
# and the same row is what the client-module registry reads to load the
# browser half (dsh.client) that renders Settings -> Auth.
- insert:
    - id: public-access-web-startup
      name: '@timgong/dsh-public-access/web-startup'

    - id: public-access-reverse-proxy
      name: '@timgong/dsh-public-access'
